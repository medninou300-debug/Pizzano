<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سجل مبيعات البيتزا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#C8372D;--green:#2E6B3C;--ink:#241E1B;--mute:#6F6762;--line:#E4DED7;--bg:#FBFAF8;--card:#fff;--gold:#E8B04B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:17px;line-height:1.5}
header{background:repeating-linear-gradient(90deg,#C8372D 0 14px,#fff 14px 28px);padding:0}
header div{background:linear-gradient(rgba(36,30,27,.88),rgba(36,30,27,.88));color:#fff;margin-top:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{font-size:20px;margin:0;font-weight:800}
.day{text-align:left;font-weight:700}.day small{display:block;font-weight:400;opacity:.75;font-size:13px}
main{max-width:760px;margin:0 auto;padding:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 10px;font-weight:700}
.mic{display:flex;flex-direction:column;align-items:center;gap:10px}
#micBtn{width:104px;height:104px;border-radius:50%;border:0;background:var(--red);color:#fff;font:700 15px Tajawal;cursor:pointer;box-shadow:0 0 0 8px rgba(200,55,45,.15)}
#micBtn.on{background:var(--green);box-shadow:0 0 0 8px rgba(46,107,60,.2);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(46,107,60,.08)}}
@media(prefers-reduced-motion:reduce){#micBtn.on{animation:none}}
#heard{min-height:28px;color:var(--mute);text-align:center}
#msg{min-height:24px;font-weight:700;text-align:center}
#msg.err{color:var(--red)}#msg.ok{color:var(--green)}
.hint{font-size:14px;color:var(--mute);text-align:center;margin:0}
.row{display:flex;gap:8px;width:100%}
input,select,button{font:inherit}
input[type=text]{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;min-width:0}
select{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn{padding:10px 14px;border:1px solid var(--ink);background:#fff;border-radius:8px;cursor:pointer;font-weight:700}
.btn.main{background:var(--green);border-color:var(--green);color:#fff}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn:focus-visible,#micBtn:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.line b{flex:1}.q{display:flex;align-items:center;gap:6px}
.q button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
.total{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:800;margin-top:12px}
.empty{color:var(--mute);text-align:center;padding:8px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;text-align:right;cursor:pointer}
.chip:active{background:#f3ede4}.chip span{display:block;color:var(--mute);font-size:14px}
details summary{cursor:pointer;font-weight:700}
.prices{display:grid;grid-template-columns:1fr 90px;gap:6px 10px;margin-top:10px;align-items:center}
.prices input{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:15px}
.wrap{overflow-x:auto}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:500}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style>
</head>
<body>
<header><div><h1>🍕 سجل مبيعات البيتزا</h1><div class="day" id="dayTotal" style="padding:0;margin:0;background:none"></div></div></header>
<main>
<section class="mic">
  <button id="micBtn" type="button">🎤<br>اضغط وتكلم</button>
  <div id="heard" aria-live="polite"></div>
  <div id="msg" aria-live="polite"></div>
  <p class="hint">مثال: «زوج بيتزا مارغريتا وواحد كولا» ثم قل «سجل» لتأكيد البيع. «إلغاء» لمسح الطلب.</p>
  <div class="row">
    <input type="text" id="manual" placeholder="أو اكتب الطلب هنا…">
    <button class="btn" id="manualBtn" type="button">أضف</button>
  </div>
  <div class="row" style="justify-content:center;align-items:center"><label for="lang" style="color:var(--mute);font-size:14px">لغة التعرف:</label>
    <select id="lang"><option value="ar-DZ">العربية (الجزائر)</option><option value="ar-SA">العربية (السعودية)</option><option value="ar-EG">العربية (مصر)</option></select></div>
</section>

<section>
  <h2>الطلب الحالي</h2>
  <div id="order"></div>
  <div class="total"><span>المجموع</span><span id="orderTotal">0 دج</span></div>
  <div class="acts"><button class="btn main" id="commit" type="button">تسجيل البيع</button><button class="btn warn" id="clear" type="button">مسح الطلب</button></div>
</section>

<section>
  <h2>القائمة (اضغط للإضافة)</h2>
  <div class="menu" id="menu"></div>
  <details style="margin-top:14px"><summary>تعديل الأسعار</summary><div class="prices" id="prices"></div></details>
</section>

<section>
  <h2>مبيعات اليوم</h2>
  <div class="wrap"><table><thead><tr><th>#</th><th>الوقت</th><th>الطلب</th><th>المبلغ</th><th></th></tr></thead><tbody id="log"></tbody></table></div>
  <div class="acts">
    <button class="btn main" id="exportCsv" type="button">تصدير CSV (Excel)</button>
    <button class="btn" id="copyCsv" type="button">نسخ البيانات</button>
    <button class="btn warn" id="newDay" type="button">بدء يوم جديد</button>
  </div>
</section>
</main>

<script>
const DEFAULT_MENU=[
 {id:'marg',name:'بيتزا مارغريتا',price:600,al:['مارغريتا','مارجريتا','مارغاريتا','مارغريطا']},
 {id:'pepp',name:'بيتزا بيبروني',price:800,al:['بيبروني','بيبيروني','ببروني']},
 {id:'four',name:'بيتزا أربع فصول',price:900,al:['_4f']},
 {id:'chick',name:'بيتزا دجاج',price:850,al:['دجاج','شيكن','جاج']},
 {id:'tuna',name:'بيتزا تونة',price:800,al:['تونه','تونا','تون']},
 {id:'veg',name:'بيتزا خضر',price:700,al:['خضر','خضار','خضرا','نباتيه']},
 {id:'mix',name:'بيتزا ميكس',price:950,al:['ميكس','مشكله','مشكل','مكس']},
 {id:'cola',name:'كولا',price:100,al:['كولا','كوكا','كوكاكولا']},
 {id:'juice',name:'عصير',price:120,al:['عصير','جوس']},
 {id:'water',name:'ماء',price:50,al:['ماء','ماي','مياه','ميا']}
];
const NUMS={'واحد':1,'واحده':1,'وحده':1,'وحد':1,'اثنين':2,'اتنين':2,'ثنين':2,'زوج':2,'زوجين':2,'ثلاثه':3,'ثلاث':3,'تلاته':3,'تلات':3,'تلاتة':3,'اربعه':4,'اربع':4,'ربعه':4,'ربع':4,'خمسه':5,'خمس':5,'ست':6,'سته':6,'سبعه':7,'سبع':7,'ثمانيه':8,'تمانيه':8,'ثمان':8,'تمنيه':8,'تسعه':9,'تسع':9,'عشره':10,'عشر':10};
const FILL=['بيتزا','بيتزات','علبه','علب','قطعه','حبه','حبات','قطع','و','من','عطيني','بغيت','نبغي'];

let menu=DEFAULT_MENU.map(m=>({...m})), order={}, sales=[];
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('en-US')+' دج';
const store={
 get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const savedPrices=store.get('pz_prices',{});menu.forEach(m=>{if(savedPrices[m.id])m.price=savedPrices[m.id]});
sales=store.get('pz_sales',[]);

function norm(s){
 return s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[\u064B-\u0652\u0640]/g,'')
  .replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[،,.؟!?]/g,' ')
  .toLowerCase().replace(/\s+/g,' ').trim();
}
function lookup(w){
 const tries=[w];
 if(w.length>3&&w.startsWith('ال'))tries.push(w.slice(2));
 if(w.length>2&&w[0]==='و'){tries.push(w.slice(1));if(w.slice(1).startsWith('ال'))tries.push(w.slice(3))}
 for(const t of tries){
  if(/^\d+$/.test(t))return {num:parseInt(t,10)};
  if(NUMS[t]!==undefined)return {num:NUMS[t]};
  for(const m of menu)if(m.al.includes(t))return {item:m.id};
  if(FILL.includes(t))return {fill:true};
 }
 return {};
}
function parse(text){
 let t=norm(text).replace(/اربع فصول|4 فصول|ربع فصول|اربعه فصول/g,' _4f ');
 const cmd=/(^| )(سجل|تسجيل|تاكيد|تم)( |$)/.test(t)?'commit':/(^| )(الغاء|الغي|امسح|مسح)( |$)/.test(t)?'clear':null;
 const toks=t.split(' ').filter(Boolean).map(lookup), found=[], used=new Set();
 toks.forEach((k,i)=>{
  if(!k.item)return;
  let q=null;
  for(let j=i-1;j>=Math.max(0,i-3);j--){
   if(toks[j].item)break;
   if(toks[j].num!==undefined&&!used.has(j)){q=toks[j].num;used.add(j);break}
  }
  if(q===null&&toks[i+1]&&toks[i+1].num!==undefined&&!used.has(i+1)&&!(toks[i+2]&&toks[i+2].item)){q=toks[i+1].num;used.add(i+1)}
  found.push({id:k.item,qty:q===null?1:q});
 });
 return {found,cmd};
}

function add(id,qty){order[id]=Math.max(0,(order[id]||0)+qty);if(!order[id])delete order[id];renderOrder()}
const byId=id=>menu.find(m=>m.id===id);
const orderTotal=()=>Object.entries(order).reduce((s,[id,q])=>s+byId(id).price*q,0);

function renderOrder(){
 const ids=Object.keys(order);
 $('order').innerHTML=ids.length?ids.map(id=>{const m=byId(id),q=order[id];
  return `<div class="line"><b>${m.name}</b><span>${fmt(m.price*q)}</span><span class="q"><button type="button" data-a="-" data-id="${id}" aria-label="إنقاص">−</button><span>${q}</span><button type="button" data-a="+" data-id="${id}" aria-label="زيادة">+</button></span></div>`}).join('')
  :'<div class="empty">لا يوجد طلب. تكلم أو اضغط على صنف من القائمة.</div>';
 $('orderTotal').textContent=fmt(orderTotal());
}
function renderMenu(){
 $('menu').innerHTML=menu.map(m=>`<button class="chip" type="button" data-id="${m.id}">${m.name}<span>${fmt(m.price)}</span></button>`).join('');
 $('prices').innerHTML=menu.map(m=>`<label for="p_${m.id}">${m.name}</label><input type="number" min="0" id="p_${m.id}" value="${m.price}" data-id="${m.id}">`).join('');
}
const today=()=>new Date().toISOString().slice(0,10);
const localDate=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const localTime=ts=>new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
function renderLog(){
 const day=localDate(Date.now()), todays=sales.filter(s=>localDate(s.ts)===day);
 $('log').innerHTML=todays.length?todays.slice().reverse().map(s=>
  `<tr><td>${s.n}</td><td>${localTime(s.ts)}</td><td>${s.items.map(i=>i.qty+'× '+i.name).join('، ')}</td><td>${fmt(s.total)}</td><td><button class="btn warn" style="padding:2px 8px" type="button" data-del="${s.n}" aria-label="حذف البيع">✕</button></td></tr>`).join('')
  :'<tr><td colspan="5" class="empty">لا توجد مبيعات اليوم بعد.</td></tr>';
 const sum=todays.reduce((s,x)=>s+x.total,0);
 $('dayTotal').innerHTML=fmt(sum)+'<small>'+todays.length+' عملية اليوم</small>';
}
function say(text,cls){$('msg').textContent=text;$('msg').className=cls||''}

function commit(){
 const ids=Object.keys(order);
 if(!ids.length){say('الطلب فارغ','err');return}
 const n=(sales.reduce((m,s)=>Math.max(m,s.n),0))+1;
 sales.push({n,ts:Date.now(),items:ids.map(id=>({name:byId(id).name,qty:order[id],price:byId(id).price})),total:orderTotal()});
 store.set('pz_sales',sales);
 const t=orderTotal();order={};renderOrder();renderLog();say('تم تسجيل البيع #'+n+' — '+fmt(t),'ok');
}
function handle(text){
 if(!text.trim())return;
 const {found,cmd}=parse(text);
 found.forEach(f=>{order[f.id]=(order[f.id]||0)+f.qty});
 if(cmd==='clear'){order={};renderOrder();say('تم مسح الطلب','ok');return}
 renderOrder();
 if(found.length)say('أضفت: '+found.map(f=>f.qty+'× '+byId(f.id).name).join('، '),'ok');
 if(cmd==='commit')commit();
 else if(!found.length)say('لم أفهم: «'+text+'» — جرب مرة أخرى أو اضغط على الصنف','err');
}

// Speech
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
function startRec(){
 rec=new SR();rec.lang=$('lang').value;rec.continuous=true;rec.interimResults=true;
 rec.onresult=e=>{
  let interim='';
  for(let i=e.resultIndex;i<e.results.length;i++){
   const tx=e.results[i][0].transcript;
   if(e.results[i].isFinal){$('heard').textContent='«'+tx.trim()+'»';handle(tx)}else interim+=tx;
  }
  if(interim)$('heard').textContent=interim+'…';
 };
 rec.onerror=e=>{
  if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;setMic();say('المايكروفون غير مسموح: فعّله من إعدادات المتصفح','err')}
  else if(e.error==='audio-capture'){listening=false;setMic();say('لا يوجد مايكروفون','err')}
 };
 rec.onend=()=>{if(listening)setTimeout(()=>{try{startRec()}catch(e){}},250);else setMic()};
 rec.start();
}
function setMic(){$('micBtn').classList.toggle('on',listening);$('micBtn').innerHTML=listening?'🎙️<br>أستمع… (إيقاف)':'🎤<br>اضغط وتكلم'}
$('micBtn').onclick=()=>{
 if(!SR){say('المتصفح لا يدعم التعرف على الصوت. استعمل Chrome أو اكتب الطلب يدويًا.','err');return}
 if(listening){listening=false;try{rec.stop()}catch(e){}setMic();return}
 listening=true;setMic();say('');try{startRec()}catch(e){listening=false;setMic()}
};
$('lang').onchange=()=>{if(listening){try{rec.stop()}catch(e){}}};

// UI events
$('manualBtn').onclick=()=>{handle($('manual').value);$('manual').value=''};
$('manual').onkeydown=e=>{if(e.key==='Enter')$('manualBtn').click()};
$('order').onclick=e=>{const b=e.target.closest('button');if(b)add(b.dataset.id,b.dataset.a==='+'?1:-1)};
$('menu').onclick=e=>{const b=e.target.closest('.chip');if(b)add(b.dataset.id,1)};
$('prices').oninput=e=>{const i=e.target;if(!i.dataset.id)return;const m=byId(i.dataset.id);m.price=Math.max(0,parseInt(i.value,10)||0);
 const p={};menu.forEach(x=>p[x.id]=x.price);store.set('pz_prices',p);
 document.querySelectorAll('.chip').forEach(c=>{const mm=byId(c.dataset.id);c.querySelector('span').textContent=fmt(mm.price)});renderOrder()};
$('commit').onclick=commit;
$('clear').onclick=()=>{order={};renderOrder();say('')};
$('log').onclick=e=>{const b=e.target.closest('[data-del]');if(!b)return;
 if(confirm('حذف هذا البيع؟')){sales=sales.filter(s=>s.n!==+b.dataset.del);store.set('pz_sales',sales);renderLog()}};

// Export
function toCsv(){
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const rows=[['رقم البيع','التاريخ','الوقت','الصنف','الكمية','سعر الوحدة','المجموع']];
 sales.forEach(s=>s.items.forEach(i=>rows.push([s.n,localDate(s.ts),localTime(s.ts),i.name,i.qty,i.price,i.qty*i.price])));
 const grand=sales.reduce((a,s)=>a+s.total,0);
 rows.push(['','','','','','الإجمالي',grand]);
 return rows.map(r=>r.map(q).join(',')).join('\r\n');
}
$('exportCsv').onclick=()=>{
 if(!sales.length){say('لا توجد مبيعات للتصدير','err');return}
 const blob=new Blob(['\ufeff'+toCsv()],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='مبيعات-'+localDate(Date.now())+'.csv';
 document.body.appendChild(a);a.click();a.remove();say('تم تصدير الملف','ok');
};
$('copyCsv').onclick=async()=>{
 if(!sales.length){say('لا توجد مبيعات للنسخ','err');return}
 try{await navigator.clipboard.writeText(toCsv());say('تم نسخ البيانات','ok')}
 catch(e){const t=document.createElement('textarea');t.value=toCsv();document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();say('تم نسخ البيانات','ok')}
};
$('newDay').onclick=()=>{
 if(!sales.length)return;
 if(confirm('صدّرت نسخة؟ سيتم مسح كل المبيعات المسجلة. متابعة؟')){sales=[];store.set('pz_sales',sales);renderLog();say('يوم جديد','ok')}
};

renderMenu();renderOrder();renderLog();
</script>
</body>
</html>
